name: Publish app update

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-app-update
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NO_GS: true
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the stable APK signing identity
        env:
          DEBUG_KEYSTORE: ${{ secrets.MOLA4FR_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE"
          mkdir -p "$ANDROID_USER_HOME"
          printf '%s' "$DEBUG_KEYSTORE" | tr -d ' \r\n' | base64 --decode > "$ANDROID_USER_HOME/debug.keystore"
          chmod 600 "$ANDROID_USER_HOME/debug.keystore"
          # Fail early with a clear message if the secret was pasted incompletely.
          if ! keytool -list -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android \
              -alias androiddebugkey > /dev/null; then
            echo "::error::Le secret MOLA4FR_KEYSTORE_BASE64 est invalide : recolle le contenu complet de MOLA4FR_KEYSTORE_BASE64.txt."
            exit 1
          fi
      - name: Verify and build the universal APK
        run: |
          bash gradlew :fermata:testMobileDebugUnitTest :fermata:testAutoDebugUnitTest :web:testMobileDebugUnitTest :tv:testMobileDebugUnitTest :fermata:lintMobileDebug :fermata:lintAutoDebug :fermata:packageAutoDebugUniversalApk --console=plain
      - name: Prepare and verify release assets
        id: version
        run: |
          mkdir -p release-assets
          cp fermata/build/outputs/apk_from_bundle/autoDebug/*-universal.apk release-assets/MOLA4FR.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release-assets/MOLA4FR.apk | tee release-assets/signature.txt
          grep -q '8f66f532ef8f2142a75692c9180347f07644536526996bfa44ed826948b703a2' release-assets/signature.txt
          python3 scripts/verify_security_apk.py release-assets/MOLA4FR.apk --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output release-assets/security-apk-check.json
          python3 scripts/create_update_manifest.py release-assets/MOLA4FR.apk release-assets/update-auto-debug.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('release-assets/update-auto-debug.json').read_text())
          tag = 'v' + data['versionName']
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('The tag must match appVersionName in gradle/libs.versions.toml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + tag + '\n')
          PY
      - name: Publish one complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG assets"
            gh release delete-asset "$TAG" MOLA4FR.apk --yes || true
            gh release delete-asset "$TAG" update-auto-debug.json --yes || true
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "MOLA4FR $TAG" --notes-file NOTES_DE_VERSION.md
          fi
          gh release upload "$TAG" release-assets/MOLA4FR.apk release-assets/update-auto-debug.json --clobber
          gh release edit "$TAG" --draft=false --latest
